<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>FLIP</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <div id="title">
      FLIP
    </div>

    <div id="stats">

      <div>
        Deck:
        <strong id="remaining">
          52
        </strong>
      </div>

      <div>
        Discarded:
        <strong id="discarded">
          0
        </strong>
      </div>

      <div>
        In Hand:
        <strong id="inHand">
          0
        </strong>
      </div>

      <div>
        Games:
        <strong id="gamesPlayed">
          0
        </strong>
      </div>

    </div>

    <div id="message"></div>

    <div id="tableOuter">

      <div id="tableRail">

        <div id="tableFelt">

          <div id="feltLogo">
            FLIP
          </div>

          <div id="handArea">

            <div id="playArea"></div>

            <div id="buriedStack">

              <div class="buriedCard"></div>
              <div class="buriedCard"></div>
              <div class="buriedCard"></div>

              <div id="buriedCount">
                +0
              </div>

              <div id="buriedLabel">
                Tap to spread
              </div>

            </div>

          </div>

          <div id="instructions">

            Tap individual cards or drag across several cards to select them.

          </div>

          <div id="controls">

            <button id="discardButton">
              Discard Selected
            </button>

            <button id="newGameButton">
              New Game
            </button>

          </div>

          <div id="deckArea">

            <div id="deck">

              <div class="deckLayer one"></div>
              <div class="deckLayer two"></div>

              <div id="deckBack"></div>

            </div>

            <div id="deckCount">
              52 cards
            </div>

            <div id="tapDeck">
              Tap deck to flip
            </div>

          </div>

          <div id="discardArea">

            <div id="discardPile">

              <div class="discardPlaceholder"></div>

            </div>

            <div id="discardLabel">
              Discard pile
            </div>

          </div>

          <div id="winOverlay">

            <div id="winPanel">

              <h2>
                PERFECT GAME!
              </h2>

              <p>
                You eliminated all 52 cards.
              </p>

              <button id="playAgainButton">
                Play Again
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
